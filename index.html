<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Event Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎓 Campus Event Hub</h1>
    <p>Discover. Participate. Enjoy!</p>
  </header>

  <main>
    <section class="welcome">
      <h2>Welcome to Campus Events</h2>
      <p>Find interesting events happening in your college.</p>
      <input id="search" type="text" placeholder="Search events...">
    </section>

    <section>
      <h2>Upcoming Events</h2>
      <div id="eventList" class="event-list"></div>
    </section>

    <section>
      <h2>My Registered Events</h2>
      <ul id="myEvents"></ul>
    </section>
  </main>

  <footer>
    <p>© 2026 Campus Event Hub</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
